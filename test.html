<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pages test</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a202c; background: #ffffff; }
  .box { border: 1px solid #cbd5e0; border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
</style>
</head>
<body>
  <h1>This is a test</h1>
  <p>If you can read this as a formatted page (not HTML code), GitHub Pages works.</p>

  <div class="box">
    <p>An inline chart, to check that images show:</p>
    <svg width="200" height="100" role="img" aria-label="Three test bars">
      <rect x="10" y="60" width="40" height="40" fill="#2b6cb0"></rect>
      <rect x="80" y="40" width="40" height="60" fill="#2b6cb0"></rect>
      <rect x="150" y="20" width="40" height="80" fill="#dd6b20"></rect>
    </svg>
  </div>

  <details>
    <summary>Click to expand</summary>
    <p>Expandable sections work.</p>
  </details>

  <p><a href="https://www.biorxiv.org/">A link to bioRxiv</a>, to check that links open.</p>
</body>
</html>
